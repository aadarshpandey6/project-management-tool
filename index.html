<!DOCTYPE html>
<html>
<head>
    <title>Project Management Tool</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        .board {
            display: flex;
            gap: 20px;
        }

        .column {
            background: white;
            padding: 20px;
            width: 30%;
            min-height: 200px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .task {
            background: #e2e8f0;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 Project Management Tool</h1>

    <input id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add Task</button>

    <div class="board">

        <div class="column">
            <h3>📝 To Do</h3>
            <div id="todo"></div>
        </div>

        <div class="column">
            <h3>⚙️ In Progress</h3>
            <div id="progress"></div>
        </div>

        <div class="column">
            <h3>✅ Done</h3>
            <div id="done"></div>
        </div>

    </div>

</div>

<script>
function addTask() {

    const input = document.getElementById("taskInput");

    if (input.value.trim() === "") {
        alert("Enter a task");
        return;
    }

    const task = document.createElement("div");

    task.className = "task";
    task.innerText = input.value;

    document.getElementById("todo").appendChild(task);

    input.value = "";
}
</script>

</body>
</html>
